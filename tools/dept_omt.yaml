tools:
  omt_get_revenue_summary:
    kind: postgres-sql
    source: olist-db
    description: >
      Get overall revenue KPIs for a date range (max 1 year).
      date_from and date_to must be in YYYY-MM-DD format.
      The date range is automatically capped at 1 year from date_from.
      Output fields:
        - total_orders: total number of unique orders placed by customers in this period
        - total_revenue: total sum of product prices across all orders, excluding shipping/freight costs
        - total_payment_collected: total actual amount collected from customers including all payment types
        - avg_order_value: average product price per order, indicating typical basket size
        - avg_items_per_order: average number of product items per order
    parameters:
      - name: date_from
        type: string
        description: Start date inclusive (YYYY-MM-DD)
      - name: date_to
        type: string
        description: End date inclusive (YYYY-MM-DD), max 1 year from date_from
    statement: |
      SELECT
        COUNT(DISTINCT order_id)                        AS total_orders,
        ROUND(SUM(total_price)::numeric, 2)             AS total_revenue,
        ROUND(SUM(total_payment)::numeric, 2)           AS total_payment_collected,
        ROUND(AVG(total_price)::numeric, 2)             AS avg_order_value,
        ROUND(AVG(total_items)::numeric, 1)             AS avg_items_per_order
      FROM centralize.fact_order
      WHERE order_date >= $1::date
        AND order_date < LEAST($2::date, ($1::date + INTERVAL '1 year'));

  omt_get_order_status_breakdown:
    kind: postgres-sql
    source: olist-db
    description: >
      Get count and percentage of orders grouped by status for a date range (max 1 year).
      Useful for monitoring order funnel health and identifying bottlenecks.
      date_from and date_to must be in YYYY-MM-DD format.
      Output fields:
        - order_status: current lifecycle status of the order.
            Possible values: delivered (completed), shipped (in transit),
            processing (being prepared), canceled (order was canceled),
            invoiced (invoice issued), approved (payment approved),
            unavailable (item out of stock)
        - total_orders: number of orders currently in this status
        - total_revenue: total product revenue from orders in this status
        - pct_of_orders: this status share as a percentage of all orders in the period
    parameters:
      - name: date_from
        type: string
        description: Start date inclusive (YYYY-MM-DD)
      - name: date_to
        type: string
        description: End date inclusive (YYYY-MM-DD), max 1 year from date_from
    statement: |
      SELECT
        order_status,
        COUNT(*)                                                      AS total_orders,
        ROUND(SUM(total_price)::numeric, 2)                           AS total_revenue,
        ROUND(COUNT(*) * 100.0 / SUM(COUNT(*)) OVER (), 2)           AS pct_of_orders
      FROM centralize.fact_order
      WHERE order_date >= $1::date
        AND order_date < LEAST($2::date, ($1::date + INTERVAL '1 year'))
      GROUP BY order_status
      ORDER BY total_orders DESC;

  omt_get_top_sellers:
    kind: postgres-sql
    source: olist-db
    description: >
      Get top performing sellers ranked by revenue for a date range (max 1 year).
      date_from and date_to must be in YYYY-MM-DD format.
      Output fields:
        - seller_id: unique system identifier for the seller on the Olist platform
        - seller_city: Brazilian city where the seller's business is registered
        - seller_state: Brazilian state (UF code) where the seller is registered, e.g. SP, RJ, MG
        - total_orders: number of unique customer orders this seller fulfilled in the period
        - total_items_sold: total quantity of individual product items sold by this seller
        - total_revenue: total product price revenue generated by this seller, excluding freight
        - total_freight: total shipping/freight cost charged by this seller across all orders
    parameters:
      - name: date_from
        type: string
        description: Start date inclusive (YYYY-MM-DD)
      - name: date_to
        type: string
        description: End date inclusive (YYYY-MM-DD), max 1 year from date_from
      - name: limit
        type: integer
        description: Number of top sellers to return (max 50, recommended 10)
    statement: |
      SELECT
        fi.seller_id,
        u.city                                         AS seller_city,
        u.state                                        AS seller_state,
        COUNT(DISTINCT fi.order_id)                    AS total_orders,
        SUM(fi.order_item_id)                          AS total_items_sold,
        ROUND(SUM(fi.total_price)::numeric, 2)         AS total_revenue,
        ROUND(SUM(fi.total_freight_value)::numeric, 2) AS total_freight
      FROM centralize.fact_order_item fi
      LEFT JOIN centralize.dim_user u
        ON fi.seller_id = u.user_id AND u.user_type = 'seller'
      WHERE fi.order_date >= $1::date
        AND fi.order_date < LEAST($2::date, ($1::date + INTERVAL '1 year'))
      GROUP BY fi.seller_id, u.city, u.state
      ORDER BY total_revenue DESC
      LIMIT LEAST($3, 50);

  omt_get_top_categories:
    kind: postgres-sql
    source: olist-db
    description: >
      Get top product categories ranked by revenue for a date range (max 1 year).
      date_from and date_to must be in YYYY-MM-DD format.
      Output fields:
        - category: product category name in Portuguese (e.g. cama_mesa_banho, esporte_lazer).
            Shown as 'unknown' if the product has no category mapping
        - total_orders: number of unique orders that contain at least one product from this category
        - total_items_sold: total quantity of individual items sold across all orders in this category
        - total_revenue: total product price revenue generated by this category, excluding freight
    parameters:
      - name: date_from
        type: string
        description: Start date inclusive (YYYY-MM-DD)
      - name: date_to
        type: string
        description: End date inclusive (YYYY-MM-DD), max 1 year from date_from
      - name: limit
        type: integer
        description: Number of top categories to return (max 50, recommended 10)
    statement: |
      SELECT
        COALESCE(p.category_name, 'unknown')      AS category,
        COUNT(DISTINCT fi.order_id)               AS total_orders,
        SUM(fi.order_item_id)                     AS total_items_sold,
        ROUND(SUM(fi.total_price)::numeric, 2)    AS total_revenue
      FROM centralize.fact_order_item fi
      LEFT JOIN centralize.dim_product p ON fi.product_id = p.product_id
      WHERE fi.order_date >= $1::date
        AND fi.order_date < LEAST($2::date, ($1::date + INTERVAL '1 year'))
      GROUP BY p.category_name
      ORDER BY total_revenue DESC
      LIMIT LEAST($3, 50);

  omt_get_customer_satisfaction:
    kind: postgres-sql
    source: olist-db
    description: >
      Get customer satisfaction metrics for a date range (max 1 year).
      Scores are based on post-delivery reviews submitted by customers.
      date_from and date_to must be in YYYY-MM-DD format.
      Output fields:
        - overall_avg_score: weighted average review score across all reviewed orders (scale 1-5,
            where 5 is most satisfied and 1 is least satisfied)
        - total_reviews: total number of customer reviews submitted for orders in this period
        - score_5: number of orders that received a perfect 5-star rating (very satisfied)
        - score_4: number of orders rated 4 stars (satisfied)
        - score_3: number of orders rated 3 stars (neutral)
        - score_2: number of orders rated 2 stars (dissatisfied)
        - score_1: number of orders rated 1 star (very dissatisfied)
    parameters:
      - name: date_from
        type: string
        description: Start date inclusive (YYYY-MM-DD)
      - name: date_to
        type: string
        description: End date inclusive (YYYY-MM-DD), max 1 year from date_from
    statement: |
      SELECT
        ROUND(AVG(avg_score)::numeric, 2)                                             AS overall_avg_score,
        SUM(total_reviews)                                                            AS total_reviews,
        SUM(CASE WHEN avg_score = 5 THEN total_reviews ELSE 0 END)                   AS score_5,
        SUM(CASE WHEN avg_score >= 4 AND avg_score < 5 THEN total_reviews ELSE 0 END) AS score_4,
        SUM(CASE WHEN avg_score >= 3 AND avg_score < 4 THEN total_reviews ELSE 0 END) AS score_3,
        SUM(CASE WHEN avg_score >= 2 AND avg_score < 3 THEN total_reviews ELSE 0 END) AS score_2,
        SUM(CASE WHEN avg_score < 2 THEN total_reviews ELSE 0 END)                   AS score_1
      FROM centralize.fact_order_review
      WHERE order_date >= $1::date
        AND order_date < LEAST($2::date, ($1::date + INTERVAL '1 year'));

  omt_get_delivery_performance:
    kind: postgres-sql
    source: olist-db
    description: >
      Get delivery performance metrics for delivered orders in a date range (max 1 year).
      Only includes orders with status = delivered and a confirmed delivery date.
      date_from and date_to must be in YYYY-MM-DD format.
      Output fields:
        - total_delivered: total number of orders that were successfully delivered to customers
        - avg_delivery_days: average elapsed days from order purchase timestamp to actual delivery date,
            indicating overall logistics speed
        - on_time_count: number of orders delivered on or before the estimated delivery date
            that was promised to the customer at purchase time
        - late_count: number of orders delivered after the promised estimated delivery date,
            indicating logistics failures or delays
        - on_time_rate_pct: percentage of delivered orders that arrived on time (on_time_count / total_delivered * 100)
    parameters:
      - name: date_from
        type: string
        description: Start date inclusive (YYYY-MM-DD)
      - name: date_to
        type: string
        description: End date inclusive (YYYY-MM-DD), max 1 year from date_from
    statement: |
      SELECT
        COUNT(*)                                                          AS total_delivered,
        ROUND(AVG(
          EXTRACT(EPOCH FROM (order_delivered_customer_date - order_purchase_timestamp)) / 86400
        )::numeric, 1)                                                    AS avg_delivery_days,
        SUM(CASE WHEN order_delivered_customer_date <= order_estimated_delivery_date
                 THEN 1 ELSE 0 END)                                       AS on_time_count,
        SUM(CASE WHEN order_delivered_customer_date > order_estimated_delivery_date
                 THEN 1 ELSE 0 END)                                       AS late_count,
        ROUND(
          SUM(CASE WHEN order_delivered_customer_date <= order_estimated_delivery_date
                   THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2
        )                                                                 AS on_time_rate_pct
      FROM centralize.fact_order
      WHERE order_status = 'delivered'
        AND order_date >= $1::date
        AND order_date < LEAST($2::date, ($1::date + INTERVAL '1 year'))
        AND order_delivered_customer_date IS NOT NULL;

  omt_get_payment_methods:
    kind: postgres-sql
    source: olist-db
    description: >
      Get payment method breakdown by revenue and order count for a date range (max 1 year).
      date_from and date_to must be in YYYY-MM-DD format.
      Output fields:
        - payment_type: payment method used by the customer.
            Possible values: credit_card (most common, supports installments),
            boleto (Brazilian bank slip, paid offline), voucher (store credit/gift card),
            debit_card (direct bank debit)
        - total_orders: number of unique orders paid via this payment method
        - total_collected: total monetary value collected through this payment method in BRL
        - avg_installments: average number of installment payments chosen by customers
            (only meaningful for credit_card; boleto and debit_card are always 1)
        - pct_of_orders: share of this payment method as a percentage of all orders in the period
    parameters:
      - name: date_from
        type: string
        description: Start date inclusive (YYYY-MM-DD)
      - name: date_to
        type: string
        description: End date inclusive (YYYY-MM-DD), max 1 year from date_from
    statement: |
      SELECT
        payment_type,
        COUNT(DISTINCT order_id)                                                           AS total_orders,
        ROUND(SUM(total_payment_value)::numeric, 2)                                        AS total_collected,
        ROUND(AVG(payment_installments)::numeric, 1)                                       AS avg_installments,
        ROUND(COUNT(DISTINCT order_id) * 100.0 / SUM(COUNT(DISTINCT order_id)) OVER (), 2) AS pct_of_orders
      FROM centralize.fact_payment
      WHERE order_date >= $1::date
        AND order_date < LEAST($2::date, ($1::date + INTERVAL '1 year'))
      GROUP BY payment_type
      ORDER BY total_collected DESC;
