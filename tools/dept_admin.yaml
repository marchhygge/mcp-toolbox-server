tools:
  admin_get_user_summary:
    kind: mysql-sql
    source: ftask-db
    description: >
      Get a summary of users grouped by department and status.
      Useful for monitoring headcount, active vs inactive users across departments.
      Output fields:
        - department_name: name of the department
        - department_type: type/category of the department
        - total_users: total number of users in the department
        - active_users: number of users with ACTIVE status
        - inactive_users: number of users with INACTIVE status
        - manager_name: name of the department manager
    statement: |
      SELECT
        d.department_name,
        d.department_type,
        COUNT(u.user_id)                                               AS total_users,
        SUM(CASE WHEN u.status = 'ACTIVE' THEN 1 ELSE 0 END)          AS active_users,
        SUM(CASE WHEN u.status = 'INACTIVE' THEN 1 ELSE 0 END)        AS inactive_users,
        m.user_name                                                    AS manager_name
      FROM ftask.department d
      LEFT JOIN ftask.User u ON d.department_id = u.department_id
      LEFT JOIN ftask.User m ON d.manager = m.user_id
      WHERE d.status = 'ACTIVE'
      GROUP BY d.department_id, d.department_name, d.department_type, m.user_name
      ORDER BY total_users DESC;

  admin_get_ticket_performance:
    kind: mysql-sql
    source: ftask-db
    description: >
      Get ticket performance breakdown by status and type for a date range.
      Useful for tracking workload, resolution rates, and bottlenecks.
      date_from and date_to must be in YYYY-MM-DD format.
      Output fields:
        - ticket_type: ticket category (TYPE1, TYPE2, TYPE3)
        - status: current ticket status. Possible values: CREATED, IN_PROGRESS, RESOLVED, DONE, REJECTED, VERIFIED
        - total_tickets: number of tickets in this type/status combination
        - pct_of_type: percentage of tickets in this status within the same type
    parameters:
      - name: date_from
        type: string
        description: Start date inclusive (YYYY-MM-DD)
      - name: date_to
        type: string
        description: End date inclusive (YYYY-MM-DD)
    statement: |
      SELECT
        type                                                                              AS ticket_type,
        status,
        COUNT(*)                                                                          AS total_tickets,
        ROUND(COUNT(*) * 100.0 / SUM(COUNT(*)) OVER (PARTITION BY type), 2)             AS pct_of_type
      FROM ftask.ticket
      WHERE DATE(created_at) >= ? AND DATE(created_at) <= ?
      GROUP BY type, status
      ORDER BY type, total_tickets DESC;

  admin_get_staff_ticket_workload:
    kind: mysql-sql
    source: ftask-db
    description: >
      Get ticket workload per staff member for a date range, showing assigned and resolved counts.
      Useful for identifying overloaded staff or top performers.
      date_from and date_to must be in YYYY-MM-DD format.
      Output fields:
        - staff_name: display name of the staff member
        - email: staff email address
        - department_name: department the staff belongs to
        - assigned_tickets: total tickets assigned to this staff in the period
        - resolved_tickets: tickets with status RESOLVED or DONE
        - rejected_tickets: tickets with status REJECTED
        - resolution_rate_pct: percentage of assigned tickets that were resolved or done
    parameters:
      - name: date_from
        type: string
        description: Start date inclusive (YYYY-MM-DD)
      - name: date_to
        type: string
        description: End date inclusive (YYYY-MM-DD)
      - name: limit
        type: integer
        description: Number of staff to return (max 50, recommended 20)
    statement: |
      SELECT
        u.user_name                                                                        AS staff_name,
        u.email,
        d.department_name,
        COUNT(t.ticket_id)                                                                 AS assigned_tickets,
        SUM(CASE WHEN t.status IN ('RESOLVED', 'DONE') THEN 1 ELSE 0 END)                 AS resolved_tickets,
        SUM(CASE WHEN t.status = 'REJECTED' THEN 1 ELSE 0 END)                            AS rejected_tickets,
        ROUND(
          SUM(CASE WHEN t.status IN ('RESOLVED', 'DONE') THEN 1 ELSE 0 END) * 100.0
          / NULLIF(COUNT(t.ticket_id), 0), 2
        )                                                                                  AS resolution_rate_pct
      FROM ftask.ticket t
      JOIN ftask.User u ON t.assigned_staff = u.user_id
      LEFT JOIN ftask.department d ON u.department_id = d.department_id
      WHERE DATE(t.created_at) >= ? AND DATE(t.created_at) <= ?
      GROUP BY u.user_id, u.user_name, u.email, d.department_name
      ORDER BY assigned_tickets DESC
      LIMIT ?;

  admin_get_dashboard_usage_summary:
    kind: mysql-sql
    source: ftask-db
    description: >
      Get dashboard usage statistics for a date range, ranked by access frequency.
      Useful for understanding which dashboards are most/least used.
      date_from and date_to must be in YYYY-MM-DD format.
      Output fields:
        - dashboard_name: display name of the dashboard
        - category: dashboard category/department
        - total_accesses: total number of times the dashboard was accessed
        - unique_users: number of distinct users who accessed the dashboard
        - avg_duration_sec: average session duration in seconds per access
        - total_duration_min: total time spent on this dashboard in minutes
    parameters:
      - name: date_from
        type: string
        description: Start date inclusive (YYYY-MM-DD)
      - name: date_to
        type: string
        description: End date inclusive (YYYY-MM-DD)
      - name: limit
        type: integer
        description: Number of dashboards to return (max 50, recommended 10)
    statement: |
      SELECT
        d.dashboard_name,
        d.category,
        COUNT(l.log_id)                              AS total_accesses,
        COUNT(DISTINCT l.user_id)                    AS unique_users,
        ROUND(AVG(l.duration), 0)                    AS avg_duration_sec,
        ROUND(SUM(l.duration) / 60.0, 1)             AS total_duration_min
      FROM ftask.dashboard_usage_logs l
      JOIN ftask.dashboard d ON l.dashboard_id = d.dashboard_id
      WHERE DATE(l.accessed_at) >= ? AND DATE(l.accessed_at) <= ?
      GROUP BY d.dashboard_id, d.dashboard_name, d.category
      ORDER BY total_accesses DESC
      LIMIT ?;

  admin_get_system_activity_summary:
    kind: mysql-sql
    source: ftask-db
    description: >
      Get a summary of system audit log activity grouped by action and target entity for a date range.
      Useful for monitoring system-wide operations and detecting unusual activity.
      date_from and date_to must be in YYYY-MM-DD format.
      Output fields:
        - target_entity: the type of object affected (USER, TICKET, DASHBOARD, GROUP, DEPARTMENT, CUSTOMER)
        - action: the specific operation performed (e.g. USER_CREATED, TICKET_REJECTED, DASHBOARD_UPDATED)
        - total_events: number of times this action occurred in the period
        - unique_actors: number of distinct users who performed this action
    parameters:
      - name: date_from
        type: string
        description: Start date inclusive (YYYY-MM-DD)
      - name: date_to
        type: string
        description: End date inclusive (YYYY-MM-DD)
    statement: |
      SELECT
        target_entity,
        action,
        COUNT(*)                   AS total_events,
        COUNT(DISTINCT user_id)    AS unique_actors
      FROM ftask.system_audit_logs
      WHERE DATE(timestamp) >= ? AND DATE(timestamp) <= ?
      GROUP BY target_entity, action
      ORDER BY target_entity, total_events DESC;
